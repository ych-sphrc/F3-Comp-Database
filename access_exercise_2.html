<body>

<!-- ===== 開始畫面 ===== -->
<div class="cover" id="start">
 <div class="card">
  <h1>模擬 Microsoft Access 自學練習(二)</h1>
  <div style="font-size:15px;margin-bottom:6px">新增欄位「班別」「班號」+ 以<b>表單精靈</b>建立表單(中三 電腦科)&nbsp;
   <span id="coverFull" style="color:#a4373a;font-weight:bold"></span></div>
  <ul>
   <li>本練習<b>承接練習一</b>:資料庫中已有資料表「學生個人資料」(4 個欄位、6 筆記錄)。</li>
   <li>你要做的:回到<b>設計檢視</b>加入 2 個欄位 → <b>儲存</b> → 用<b>表單精靈</b>建表單 → 在<b>表單</b>中補上班別、班號 → 新增第 7 筆記錄。</li>
   <li>右方有逐步指示,有需要可按「顯示提示」(<span id="coverPen"></span>)。</li>
   <li>完成後按右上角<b>「完成練習,產生報告」</b>,下載報告檔並上傳給老師。</li>
  </ul>
  <label>姓名 *</label><input type="text" id="s_name" placeholder="例:陳大文">
  <label>班別 *</label><input type="text" id="s_cls" placeholder="例:3A">
  <label>班號 / 學號</label><input type="text" id="s_id" placeholder="例:12">
  <button class="go" id="btnStart">開始練習</button>
 </div>
</div>

<!-- ===== 主介面 ===== -->
<div id="top">
 <span class="t">練習二:新增欄位 + 表單精靈</span>
 <span class="info" id="topinfo"></span>
 <span class="sp"></span>
 <span class="info" id="timer">00:00</span>
 <button class="bt-rst" data-act="reset">重新開始</button>
 <button class="bt-fin" data-act="finish">完成練習,產生報告</button>
</div>

<div id="wrap">
 <div id="left">
  <div id="win">
   <div id="titlebar">
     <span id="qat"><span data-act="btn" data-arg="qsave" title="儲存 (Ctrl+S)">💾</span><span title="復原">↩</span><span title="重複">↪</span></span>
     <span id="tt"></span><span>— ▫ ✕</span>
   </div>
   <div id="tabs"></div>
   <div id="ribbon"></div>
   <div id="body">
     <div id="nav"></div>
     <div id="doc"><div id="doctabs"></div><div id="docarea"></div></div>
   </div>
   <div id="status"><span id="stmsg"></span><span class="sp"></span><span id="viewbtns"></span></div>
  </div>
 </div>
 <div id="guide"></div>
</div>

<div id="layer"></div>
<div id="ctx"></div>
<div id="rptOverlay"><div class="card" id="rptCard"></div></div>

<script>
/* ============================================================
   1. 練習設定
   ============================================================ */
const EX={
  id:'EX2',
  title:'練習二:新增欄位「班別」「班號」並以表單精靈建立表單',
  dbFile:'學生資料.accdb',
  tableName:'學生個人資料',
  formName:'學生個人資料',
  layout:'單欄式',
  baseFields:[
    {name:'學生編號',type:'文字',size:'3'},
    {name:'姓名',type:'文字',size:'20'},
    {name:'身高',type:'數字',size:'整數'},
    {name:'體重',type:'數字',size:'整數'}
  ],
  newFields:[
    {name:'班別',type:'文字',size:'2'},
    {name:'班號',type:'文字',size:'2'}
  ],
  baseData:[
    ['1','王一全','168','59'],
    ['2','陳明','163','60'],
    ['3','張恩芳','155','48'],
    ['4','李霞','152','45'],
    ['5','吳金鳳','166','50'],
    ['6','何明坤','180','68']
  ],
  addData:[['3A','30'],['3A','01'],['3B','05'],['3B','15'],['3C','24'],['3D','09']],
  rec7:['7','李快樂','164','56','3A','22']
};
EX.allFieldNames=EX.baseFields.concat(EX.newFields).map(f=>f.name);

/* ---------- 分數制:改這一行即可切換總分 ---------- */
const MARK_SET='20';   // '20' = 20 分制 / '10' = 10 分制
const MARK_SETS={
 '20':{marks:{design:2,fname:0.5,ftype:0.5,fsize:0.5,save:2,wizFields:1,wizLayout:1,wizTitle:1,wizDone:1,rec:1,rec7:3},
       penalty:{hint:0.5,hintMax:2,err:0.5,errMax:2}},
 '10':{marks:{design:1,fname:0.25,ftype:0.25,fsize:0.25,save:1,wizFields:0.5,wizLayout:0.5,wizTitle:0.5,wizDone:0.5,rec:0.5,rec7:1.5},
       penalty:{hint:0.25,hintMax:1,err:0.25,errMax:1}}
};
EX.marks=MARK_SETS[MARK_SET].marks;
EX.penalty=MARK_SETS[MARK_SET].penalty;

const TYPES=['','文字','備忘','數字','日期/時間','貨幣','自動編號','是/否','OLE 物件','超連結','附件','計算','查閱精靈...'];
const NUMSIZE=['位元組','整數','長整數','單精度浮點數','雙精度浮點數','複製識別碼','小數'];
const LAYOUTS=['單欄式','表格式','資料工作表','對齊'];

/* ============================================================
   2. 狀態
   ============================================================ */
const st={
 info:{name:'',cls:'',sid:''}, start:null, submits:0,
 tab:'create', visited:{}, view:'none', navSel:null,
 savedFields:EX.baseFields.map(f=>({name:f.name,type:f.type,size:f.size})),
 rows:[], sel:0, pk:0,
 records:EX.baseData.map(r=>{const o={};EX.baseFields.forEach((f,i)=>o[f.name]=r[i]);return o;}),
 selRec:-1,
 enteredDesign:false, viaNavDesign:false, saveCount:0, tableDirty:false,
 wizOpened:false, formCreated:false, formFields:[], formLayout:'', formTitle:'',
 curRec:0, newRec:false, formEdits:0, dsEdits:0,
 hints:0, errs:0, hintShown:{}, log:[]
};
st.rows=st.savedFields.map(f=>({name:f.name,type:f.type,size:f.size,desc:'',orig:f.name}));

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtM=n=>String(+Number(n).toFixed(2));
function log(t){st.log.push(new Date().toLocaleTimeString('zh-HK',{hour12:false})+' '+t);if(st.log.length>250)st.log.shift();}
function setStatus(t){$('#stmsg').textContent=t;}
function pad(){while(st.rows.length<9)st.rows.push({name:'',type:'',size:'',desc:'',orig:''});
 if(st.rows[st.rows.length-1].name.trim()!=='')st.rows.push({name:'',type:'',size:'',desc:'',orig:''});}
const dRows=()=>st.rows.filter(r=>r.name.trim()!=='');
const fdef=n=>st.savedFields.find(f=>f.name===n);
const fullMark=()=>{const M=EX.marks;return M.design+2*(M.fname+M.ftype+M.fsize)+M.save+M.wizFields+M.wizLayout+M.wizTitle+M.wizDone+6*M.rec+M.rec7;};

/* ============================================================
   3. 報告樣式
   ============================================================ */
const RPT_CSS=`
.rpt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;border-bottom:2px solid #20476b;padding-bottom:10px;margin-bottom:6px}
.rpt-head h1{margin:0 0 6px;font-size:19px;color:#20476b}
.rpt-head .meta{font-size:13px;line-height:1.65}
.scorebox{border:3px solid #20476b;border-radius:8px;background:#f2f6fb;padding:8px 16px;text-align:center;min-width:180px;flex:0 0 auto}
.scorebox .sb-l{font-size:12px;color:#20476b;letter-spacing:1px}
.scorebox .sb-s{font-size:36px;font-weight:bold;color:#20476b;line-height:1.15}
.scorebox .sb-s .sb-t{font-size:17px;color:#555;font-weight:normal}
.scorebox .sb-p{font-size:12.5px;color:#333;border-top:1px solid #a9bcd0;margin-top:4px;padding-top:3px}
table.rpt{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
table.rpt th,table.rpt td{border:1px solid #bbb;padding:4px 6px}
table.rpt th{background:#e8ecf1}
table.rpt td.c,table.rpt th.c{text-align:center}
.bad{color:#b00}.good{color:#0a7a3f}
.dig{font-family:Consolas,monospace;font-size:11px;word-break:break-all;background:#f4f4f4;border:1px solid #ccc;padding:6px}
.signbox{border:1px solid #999;padding:8px;font-size:12.5px;margin-top:10px;color:#444}
h2.rh2{font-size:15px;color:#20476b;margin:14px 0 4px}
`;
document.head.insertAdjacentHTML('beforeend','<style>'+RPT_CSS+'</style>');

/* ============================================================
   4. 對話框 / 右鍵選單
   ============================================================ */
function dlg(title,html,btns){
 const L=$('#layer');
 L.innerHTML='<div class="dlg"><div class="dh">'+esc(title)+'</div><div class="db">'+html+'</div><div class="df">'+
  btns.map((b,i)=>'<button data-i="'+i+'">'+esc(b.label)+'</button>').join('')+'</div></div>';
 L.style.display='flex';
 L.querySelectorAll('.df button').forEach(b=>b.onclick=()=>{L.style.display='none';const f=btns[+b.dataset.i].fn;if(f)f();});
}
function msgbox(t,after){dlg('Microsoft Access',t,[{label:'確定',fn:after}]);}
function wrongClick(m){st.errs++;log('誤操作:'+m);setStatus('⚠ '+m);msgbox(m);}
function showCtx(x,y,items){
 const c=$('#ctx');
 c.innerHTML=items.map((it,i)=>it.sep?'<div class="sepx"></div>':'<div data-i="'+i+'">'+esc(it.label)+'</div>').join('');
 c.style.display='block';c.style.left=Math.min(x,innerWidth-190)+'px';c.style.top=y+'px';

function saveTable(after){
 const rows=dRows();
 if(!rows.length){msgbox('必須至少定義一個欄位。');return;}
 const names=rows.map(r=>r.name.trim());
 const dup=names.find((n,i)=>names.indexOf(n)!==i);
 if(dup){msgbox('資料表中已有名為「'+esc(dup)+'」的欄位。欄位名稱不可重複。');return;}
 const oldNames=st.savedFields.map(f=>f.name);
 const ns=rows.map(r=>({name:r.name.trim(),type:r.type||'文字',size:r.size||(r.type==='數字'?'長整數':'255')}));
 st.records.forEach(rec=>{
  rows.forEach(r=>{const nn=r.name.trim();
   if(r.orig&&r.orig!==nn&&Object.prototype.hasOwnProperty.call(rec,r.orig)){rec[nn]=rec[r.orig];delete rec[r.orig];}
   if(rec[nn]===undefined)rec[nn]='';});
  oldNames.forEach(o=>{if(!ns.some(f=>f.name===o)&&!rows.some(r=>r.orig===o))delete rec[o];});
 });
 rows.forEach(r=>r.orig=r.name.trim());
 st.savedFields=ns;st.saveCount++;st.tableDirty=false;
 log('儲存資料表:欄位 = '+ns.map(f=>f.name).join('、'));
 setStatus('已儲存資料表「'+EX.tableName+'」的變更。');
 render();
 if(after)after(); else msgbox('已儲存資料表「'+esc(EX.tableName)+'」的設計變更。');
}
function toggleView(target){
 if(st.view==='form'){msgbox('本練習不需要修改表單的設計。請在表單檢視中輸入資料。');return;}
 if(st.view==='none'){wrongClick('請先在導覽窗格開啟資料表「'+EX.tableName+'」。');return;}
 const want=target||(st.view==='design'?'datasheet':'design');
 if(want===st.view)return;
 if(want==='design'){openDesign(false);return;}
 if(st.tableDirty){
  dlg('Microsoft Access','您必須先儲存資料表。<br><br>是否要立即儲存資料表?',
   [{label:'是(Y)',fn:()=>saveTable(openDatasheet)},{label:'否(N)',fn:()=>{}}]);
  return;
 }
 openDatasheet();
}
function btn(id){
 if(id==='x'){wrongClick('本練習不需要使用這個按鈕,請按右方指示操作。');return;}
 if(id==='tbldesign'){wrongClick('這會建立一個「新的」資料表。本練習要修改現有的資料表:請在導覽窗格用滑鼠右鍵按「'+EX.tableName+'」→ 設計檢視。');return;}
 if(id==='formauto'){wrongClick('「表單」按鈕會直接自動產生表單,不能選版面配置。本練習要求使用「表單精靈」。');return;}
 if(id==='wiz'){startWizard();return;}
 if(id==='view'){toggleView();return;}
 if(id==='qsave'){
  if(st.view==='none'){wrongClick('尚未開啟任何物件。');return;}
  if(st.view==='form'){msgbox('表單已儲存。記錄的變更會自動儲存。');return;}
  saveTable();return;
 }
 if(id==='pk'){
  if(st.view!=='design'){wrongClick('必須在設計檢視才可以設定主索引鍵。');return;}
  const r=st.rows[st.sel];
  if(!r||!r.name.trim()){wrongClick('請先選取一個已命名的欄位。');return;}
  if(st.pk===st.sel){st.pk=null;log('取消主索引鍵');}
  else{st.pk=st.sel;log('設定主索引鍵:'+r.name.trim());}
  st.tableDirty=true;render();return;
 }
 if(id==='insrow'){if(st.view!=='design')return;st.rows.splice(st.sel,0,{name:'',type:'',size:'',desc:'',orig:''});
  if(st.pk!=null&&st.pk>=st.sel)st.pk++;st.tableDirty=true;render();return;}
 if(id==='delrow'){if(st.view!=='design')return;
  dlg('Microsoft Access','是否永久刪除選取的欄位及其所有資料?',[{label:'是(Y)',fn:()=>{
   st.rows.splice(st.sel,1);if(st.pk===st.sel)st.pk=null;else if(st.pk!=null&&st.pk>st.sel)st.pk--;
   if(st.sel>=st.rows.length)st.sel=st.rows.length-1;st.tableDirty=true;pad();render();}},{label:'否(N)',fn:()=>{}}]);
  return;}
 if(id==='recnew'){
  if(st.view==='form'){fnav('new');return;}
  if(st.view==='datasheet'){const el=document.querySelector('.ds-new');if(el)el.focus();return;}
  wrongClick('請先開啟表單或資料工作表檢視。');return;}
 if(id==='recdel'){
  if(st.view==='form'){
   dlg('Microsoft Access','您即將刪除目前顯示的 1 筆記錄。<br>此操作無法復原,確定嗎?',
    [{label:'是(Y)',fn:()=>{st.records.splice(st.curRec,1);if(st.curRec>=st.records.length)st.curRec=Math.max(0,st.records.length-1);log('在表單刪除一筆記錄');render();}},{label:'否(N)',fn:()=>{}}]);
   return;}
  if(st.view==='datasheet'){
   if(st.selRec<0){msgbox('請先按記錄左邊的列選取器,選取要刪除的記錄。');return;}
   dlg('Microsoft Access','您即將刪除 1 筆記錄,無法復原。確定嗎?',
    [{label:'是(Y)',fn:()=>{st.records.splice(st.selRec,1);st.selRec=-1;log('刪除一筆記錄');render();}},{label:'否(N)',fn:()=>{}}]);
   return;}
  wrongClick('請先開啟表單或資料工作表檢視。');return;}
}
function coerce(name,v){
 const f=fdef(name);if(!f)return v;
 if(f.type==='數字'){const o=v;v=v.replace(/[^0-9\-]/g,'');if(o!==v)setStatus('「'+name+'」的資料類型是「數字」,只可輸入數字。');}
 if(f.type==='文字'){const n=parseInt(f.size,10);
  if(!isNaN(n)&&n>0&&v.length>n){v=v.slice(0,n);setStatus('「'+name+'」的欄位大小為 '+n+',最多只可輸入 '+n+' 個字元。');}}
 return v;
}
function fnav(a){
 if(st.view!=='form')return;
 const n=st.records.length;
 if(a==='first'){st.newRec=false;st.curRec=0;}
 if(a==='prev'){if(st.newRec){st.newRec=false;st.curRec=n-1;}else st.curRec=Math.max(0,st.curRec-1);}
 if(a==='next'){if(!st.newRec){if(st.curRec<n-1)st.curRec++;else st.newRec=true;}}
 if(a==='last'){st.newRec=false;st.curRec=Math.max(0,n-1);}
 if(a==='new'){st.newRec=true;}
 renderDoc();renderGuide();
 const el=document.querySelector('#fv input');if(el)el.focus();
}

 }

function wizMove(a){
 const A=$('#wA'),S=$('#wS');
 if(a==='add'){const v=[...A.selectedOptions].map(o=>o.value);if(!v.length){msgbox('請先在左邊選取要加入的欄位,或按 &gt;&gt; 加入全部欄位。');return;}
  wiz.sel=wiz.sel.concat(v);wiz.avail=wiz.avail.filter(n=>!v.includes(n));log('表單精靈:加入欄位 '+v.join('、'));}
 if(a==='addall'){wiz.sel=wiz.sel.concat(wiz.avail);wiz.avail=[];log('表單精靈:加入全部欄位');}
 if(a==='rem'){const v=[...S.selectedOptions].map(o=>o.value);wiz.sel=wiz.sel.filter(n=>!v.includes(n));
  wiz.avail=st.savedFields.map(f=>f.name).filter(n=>!wiz.sel.includes(n));}
 if(a==='remall'){wiz.sel=[];wiz.avail=st.savedFields.map(f=>f.name);}
 wizRender();
}
function wizBtn(w){
 if(w==='cancel'){$('#layer').style.display='none';log('取消表單精靈');return;}
 if(w==='back'){if(wiz.step===3)wiz.title=($('#wT')||{value:wiz.title}).value;wiz.step--;wizRender();return;}
 if(w==='next'){
  if(wiz.step===1){if(!wiz.sel.length){msgbox('您必須至少選取一個欄位。');return;}}
  wiz.step++;wizRender();return;}
 if(w==='fin'){
  if(!wiz.sel.length){msgbox('您必須至少選取一個欄位。');return;}
  if(wiz.step===3)wiz.title=($('#wT')||{value:wiz.title}).value;
  const t=wiz.title.trim();
  if(!t){msgbox('請輸入表單標題。');return;}
  const create=()=>{
   $('#layer').style.display='none';
   st.formCreated=true;st.formFields=wiz.sel.slice();st.formLayout=wiz.layout;st.formTitle=t;
   st.curRec=0;st.newRec=false;
   log('表單精靈完成:標題「'+t+'」,版面配置「'+wiz.layout+'」,欄位 '+wiz.sel.join('、'));
   setStatus('已建立表單「'+t+'」。');
   openForm();
  };
  if(st.formCreated){
   dlg('Microsoft Access','已經有一個名為「'+esc(t)+'」的表單存在。<br><br>是否要取代現有的表單?',
    [{label:'是(Y)',fn:create},{label:'否(N)',fn:()=>{}}]);
   return;
  }
  create();return;
 }
}

document.addEventListener('click',e=>{

 if(el.classList.contains('ds-new')){

 if(el.classList.contains('fv-cell')){

  st.records[st.curRec][n]=v;st.formEdits++;renderGuide();return;}
 if(el.classList.contains('fv-new')){

  const rec={};st.savedFields.forEach(f=>rec[f.name]='');rec[n]=v;st.records.push(rec);

document.addEventListener('keydown',e=>{

});

function rowOf(n){return dRows().find(r=>r.name.trim()===n);}
function newFieldOk(e){const r=rowOf(e.name);return !!r&&r.type===e.type&&String(r.size).trim()===e.size;}
function savedOk(){return EX.newFields.every(e=>{const f=fdef(e.name);return f&&f.type===e.type&&String(f.size).trim()===e.size;});}
function wizOk(){return st.formCreated&&EX.allFieldNames.every(n=>st.formFields.includes(n))&&st.formLayout===EX.layout&&st.formTitle.trim()===EX.formName;}
function cmp(a,b){const x=String(a==null?'':a).trim(),y=String(b).trim();return x===y;}
function recsOk(){return EX.addData.every((p,i)=>{const r=st.records[i];return r&&cmp(r['班別'],p[0])&&cmp(r['班號'],p[1]);});}
function rec7Ok(){const r=st.records[6];if(!r)return false;return EX.allFieldNames.every((n,i)=>cmp(r[n],EX.rec7[i]));}
const STEPS=[
 {t:'開啟資料表「'+EX.tableName+'」的設計檢視',d:'在左邊導覽窗格用<b>滑鼠右鍵</b>按「'+EX.tableName+'」,選「設計檢視」。',
  h:'也可以先連按兩下開啟資料表,再按狀態列右下角的 📐 圖示切換到設計檢視。',f:()=>st.enteredDesign},
 {t:'加入欄位「班別」:文字,欄位大小 2',d:'在第 5 列空白處輸入「班別」,資料類型選「文字」,再在下方「欄位大小」輸入 2。',
  h:'記得先按該列左邊的列選取器,下方「欄位屬性」才會顯示這個欄位的欄位大小。',f:()=>newFieldOk(EX.newFields[0])},

  h:'思考題:班號「01」如果用「數字」類型,前面的 0 會消失變成 1,所以用「文字」較合適。',f:()=>newFieldOk(EX.newFields[1])},
 {t:'儲存資料表',d:'按 Ctrl+S 或左上角 💾。資料表已有名稱,所以不會再問你名稱。',
  h:'一定要先儲存,新欄位才會出現在表單精靈的欄位清單中。',f:savedOk},
 {t:'按「建立 → 表單精靈」',d:'切換到「建立」索引標籤,在「表單」群組按「表單精靈」。',
  h:'不要按「表單」(自動產生),要按有 🧙‍♂️ 的「表單精靈」,才可以自己選版面配置和標題。',f:()=>st.wizOpened},
 {t:'精靈:加入所有欄位 → 單欄式 → 標題「'+EX.formName+'」→ 完成',

  h:'&gt; 是加入選取的一個欄位,&gt;&gt; 是加入全部欄位。標題預設已是資料表名稱,確認一下即可。',f:wizOk},
 {t:'在表單中為原有 6 筆記錄輸入班別及班號',d:'在表單填好班別、班號後,按底部的 ▶ 移到下一筆記錄(Access 會自動儲存)。',

 {t:'新增第 7 筆記錄:7 / 李快樂 / 164 / 56 / 3A / 22',d:'按導覽列的「▶✳ 新(空白)記錄」,然後逐格輸入。',

function renderGuide(){
 const done=STEPS.map(s=>!!s.f());
 let cur=done.findIndex(d=>!d);if(cur<0)cur=STEPS.length-1;
 let h='<h3>📋 操作指引(共 '+STEPS.length+' 步,滿分 '+fmtM(fullMark())+' 分)</h3>';
 STEPS.forEach((s,i)=>{
  h+='<div class="step '+(done[i]?'ok ':'')+(i===cur?'cur':'')+'"><div class="n">'+(done[i]?'✔':(i===cur?'▶':'○'))+' 步驟 '+(i+1)+':'+s.t+'</div>'+
   '<div class="d">'+s.d+(s.h?('<div class="hb"><button data-act="hint" data-arg="'+i+'" style="border:0;background:none;color:#a4373a;font-size:12px;padding:0">💡 顯示提示(扣 '+fmtM(EX.penalty.hint)+' 分)</button></div>'):'')+
   (s.h&&st.hintShown[i]?'<div class="hintbox" style="display:block">'+s.h+'</div>':'')+'</div></div>';
 });
 h+='<div class="gsec"><b>📑 要為 6 筆記錄補入的資料</b><table id="reftab"><tr><th>記錄</th><th>姓名</th><th>班別</th><th>班號</th></tr>'+
  EX.addData.map((p,i)=>'<tr><td>第 '+(i+1)+' 筆</td><td>'+esc(EX.baseData[i][1])+'</td><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td></tr>').join('')+'</table>'+
  '<b style="display:block;margin-top:8px">➕ 要新增的第 7 筆記錄</b><table id="reftab2"><tr>'+
  EX.allFieldNames.map(n=>'<th>'+esc(n)+'</th>').join('')+'</tr><tr>'+EX.rec7.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr></table></div>';
 h+='<div class="gsec" style="font-size:12.5px"><b>目前進度:</b>'+done.filter(Boolean).length+' / '+(STEPS.length-1)+

 h+='<div class="gsec"><b>🖥 操作紀錄</b><div id="log">'+st.log.slice(-40).map(esc).reverse().join('<br>')+'</div></div>';

function bandOf(p){return p>=85?'優異':p>=70?'良好':p>=55?'尚可':p>=40?'及格':'需重做';}
function grade(){
 const M=EX.marks,items=[];
 items.push({l:'開啟資料表的設計檢視',y:st.enteredDesign?(st.viaNavDesign?'導覽窗格右鍵 → 設計檢視':'以「檢視」按鈕切換'):'未進入設計檢視',
  c:'設計檢視',g:st.enteredDesign?M.design:0,f:M.design});
 EX.newFields.forEach(e=>{
  const r=rowOf(e.name);
  items.push({l:'新增欄位「'+e.name+'」',y:r?'已加入':'找不到此欄位',c:e.name,g:r?M.fname:0,f:M.fname});
  items.push({l:'「'+e.name+'」資料類型',y:r?(r.type||'(未選)'):'—',c:e.type,g:r&&r.type===e.type?M.ftype:0,f:M.ftype});
  items.push({l:'「'+e.name+'」欄位大小',y:r?String(r.size||'(空白)'):'—',c:e.size,g:r&&String(r.size).trim()===e.size?M.fsize:0,f:M.fsize});
 });
 items.push({l:'儲存資料表的結構變更',y:st.saveCount===0?'未儲存':(savedOk()?'已儲存(含兩個新欄位)':'已儲存,但新欄位設定不正確/未儲存'),
  c:'Ctrl+S 儲存',g:st.saveCount===0?0:(savedOk()?M.save:M.save/2),f:M.save});
 const need=EX.allFieldNames,got=need.filter(n=>st.formFields.includes(n)).length;
 items.push({l:'表單精靈:加入所有欄位',y:st.formCreated?(st.formFields.join('、')||'(無)'):'未建立表單',
  c:need.join('、'),g:st.formCreated?+(M.wizFields*got/need.length).toFixed(2):0,f:M.wizFields});
 items.push({l:'表單版面配置',y:st.formLayout||'—',c:EX.layout,g:st.formLayout===EX.layout?M.wizLayout:0,f:M.wizLayout});
 items.push({l:'表單標題 / 名稱',y:st.formTitle||'—',c:EX.formName,g:st.formTitle.trim()===EX.formName?M.wizTitle:0,f:M.wizTitle});
 items.push({l:'以表單精靈成功建立表單',y:st.formCreated?'已建立':'未建立',c:'表單精靈',g:st.formCreated?M.wizDone:0,f:M.wizDone});
 EX.addData.forEach((p,i)=>{
  const r=st.records[i]||{};let g=0;
  if(cmp(r['班別'],p[0]))g+=M.rec/2;
  if(cmp(r['班號'],p[1]))g+=M.rec/2;
  items.push({l:'第 '+(i+1)+' 筆('+EX.baseData[i][1]+')班別 / 班號',
   y:(r['班別']||'—')+' / '+(r['班號']||'—'),c:p[0]+' / '+p[1],g:+g.toFixed(2),f:M.rec});
 });
 const r7=st.records[6];let g7=0;const per=M.rec7/EX.allFieldNames.length;
 const y7=EX.allFieldNames.map((n,i)=>{const v=r7?(r7[n]||''):'';if(cmp(v,EX.rec7[i]))g7+=per;return v===''?'—':v;});
 items.push({l:'第 7 筆新記錄(全部欄位)',y:y7.join(' / '),c:EX.rec7.join(' / '),g:+g7.toFixed(2),f:M.rec7});
 const full=+items.reduce((a,b)=>a+b.f,0).toFixed(2),raw=+items.reduce((a,b)=>a+b.g,0).toFixed(2);
 const dh=Math.min(st.hints*EX.penalty.hint,EX.penalty.hintMax);
 const de=Math.min(st.errs*EX.penalty.err,EX.penalty.errMax);
 const notes=[];
 if(dRows().length>6)notes.push('資料表共有 '+dRows().length+' 個欄位('+dRows().map(r=>r.name).join('、')+'),應只有 6 個。');
 if(st.tableDirty)notes.push('練習結束時,設計檢視仍有未儲存的變更。');
 if(st.formEdits===0&&st.dsEdits>0)notes.push('資料是在「資料工作表」而不是「表單」中輸入的,未按練習要求使用表單。');
 else if(st.dsEdits>0)notes.push('部分資料曾在資料工作表中輸入/修改('+st.dsEdits+' 次)。');
 if(st.records.length>7)notes.push('記錄總數為 '+st.records.length+' 筆,多於要求的 7 筆(可能誤加了空白記錄)。');
 if(st.records.length<7)notes.push('記錄總數只有 '+st.records.length+' 筆,未完成第 7 筆記錄。');
 if(st.formLayout&&st.formLayout!==EX.layout)notes.push('表單版面配置選了「'+st.formLayout+'」,練習要求「單欄式」。');
 const final=Math.max(0,+(raw-dh-de).toFixed(2));
 return {items,full,raw,dh,de,final,pct:full?Math.round(final/full*100):0,notes};
}
function fmtDur(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+' 分 '+String(s%60).padStart(2,'0')+' 秒';}
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h.toString(36).toUpperCase();}
function vcode(d){const a=hash(d).padStart(8,'0');return 'ACC2-'+a.slice(0,4)+'-'+a.slice(4,8);}
function b64e(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s)));}
function b64d(s){return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));}
function finish(){
 const done=STEPS.slice(0,-1).map(s=>!!s.f());
 if(done.includes(false)){
  dlg('尚未完成','仍有步驟未完成或未正確完成(步驟 '+done.map((d,i)=>d?null:i+1).filter(Boolean).join('、')+
   ')。<br><br>你可以先返回修改;若現在提交,未完成部分將不會得分。',
   [{label:'返回修改',fn:()=>{}},{label:'仍然提交',fn:showReport}]);
 } else showReport();
}
function showReport(){
 st.submits++;
 const g=grade(),end=new Date();
 const rep={ex:EX.id,title:EX.title,name:st.info.name,cls:st.info.cls,sid:st.info.sid,
  start:st.start.toLocaleString('zh-HK',{hour12:false}),end:end.toLocaleString('zh-HK',{hour12:false}),
  dur:fmtDur(end-st.start),hints:st.hints,errs:st.errs,submits:st.submits,
  raw:g.raw,full:g.full,dh:g.dh,de:g.de,final:g.final,pct:g.pct};
 const digest=b64e(JSON.stringify(rep)),code=vcode(digest);
 const inner=reportHTML(rep,g,digest,code);
 $('#rptCard').innerHTML=inner+
  '<div class="tb"><button class="pri" id="dl">⬇ 下載報告檔(交給老師)</button><button id="pr">🖨 列印 / 儲存為 PDF</button>'+
  '<button id="cp">📋 複製摘要碼</button><button id="bk">返回修改</button></div>';
 $('#rptOverlay').style.display='flex';
 const doc='<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Access練習2 報告 - '+
  esc(rep.cls)+' '+esc(rep.name)+' - '+fmtM(g.final)+'/'+fmtM(g.full)+'</title><style>body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;margin:22px;color:#222}'+
  RPT_CSS+'@media print{body{margin:8mm}}</style></head><body>'+inner+'</body></html>';
 $('#dl').onclick=()=>{const b=new Blob([doc],{type:'text/html;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='Access練習2_'+(rep.cls||'班別')+'_'+(rep.sid?rep.sid+'_':'')+(rep.name||'學生')+'_'+fmtM(g.final)+'分.html';a.click();};
 $('#pr').onclick=()=>{const w=window.open('','_blank');if(!w){alert('請允許彈出視窗,或改用「下載報告檔」。');return;}
  w.document.write(doc);w.document.close();w.focus();setTimeout(()=>w.print(),400);};
 $('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(digest+'\n'+code);alert('已複製摘要碼及驗證碼。');};
 $('#bk').onclick=()=>{$('#rptOverlay').style.display='none';};
}
function reportHTML(rep,g,digest,code){
 const tbl='<h2 class="rh2">三、最後的資料表內容</h2><table class="rpt"><tr>'+
  st.savedFields.map(f=>'<th class="c">'+esc(f.name)+'</th>').join('')+'</tr>'+
  st.records.map(r=>'<tr>'+st.savedFields.map(f=>'<td class="c">'+esc(r[f.name]||'')+'</td>').join('')+'</tr>').join('')+'</table>';
 return '<div class="rpt-head"><div><h1>中三 電腦科 — 資料庫練習成績報告</h1><div class="meta">'+
  '<b>練習:</b>'+esc(rep.title)+'<br>'+
  '<b>姓名:</b>'+esc(rep.name)+' &nbsp; <b>班別:</b>'+esc(rep.cls)+' &nbsp; <b>班號:</b>'+esc(rep.sid||'-')+'<br>'+
  '<b>完成時間:</b>'+esc(rep.end)+' &nbsp; <b>用時:</b>'+esc(rep.dur)+'<br>'+
  '<b>提示:</b>'+rep.hints+' 次 &nbsp; <b>誤操作:</b>'+rep.errs+' 次 &nbsp; <b>提交:</b>'+rep.submits+' 次'+
  '</div></div><div class="scorebox"><div class="sb-l">最終得分 FINAL SCORE</div>'+
  '<div class="sb-s">'+fmtM(g.final)+'<span class="sb-t"> / '+fmtM(g.full)+'</span></div>'+
  '<div class="sb-p">'+g.pct+'% &nbsp;·&nbsp; '+bandOf(g.pct)+'</div></div></div>'+
  '<h2 class="rh2">一、詳細評分</h2><table class="rpt"><tr><th style="width:26%">評分項目</th><th>你的答案 / 操作</th><th>正確答案</th><th class="c" style="width:80px">得分</th></tr>'+
  g.items.map(i=>'<tr><td>'+esc(i.l)+'</td><td class="'+(i.g===i.f?'good':'bad')+'">'+esc(i.y)+'</td><td>'+esc(i.c)+'</td><td class="c">'+fmtM(i.g)+' / '+fmtM(i.f)+'</td></tr>').join('')+
  '<tr><th colspan="3">操作項目小計</th><th class="c">'+fmtM(g.raw)+' / '+fmtM(g.full)+'</th></tr>'+
  '<tr><td colspan="3">提示扣分('+rep.hints+' × '+fmtM(EX.penalty.hint)+',上限 '+fmtM(EX.penalty.hintMax)+')</td><td class="c">- '+fmtM(g.dh)+'</td></tr>'+
  '<tr><td colspan="3">誤操作扣分('+rep.errs+' × '+fmtM(EX.penalty.err)+',上限 '+fmtM(EX.penalty.errMax)+')</td><td class="c">- '+fmtM(g.de)+'</td></tr>'+
  '<tr><th colspan="3">最終得分</th><th class="c">'+fmtM(g.final)+' / '+fmtM(g.full)+'</th></tr></table>'+
  (g.notes.length?'<h2 class="rh2">二、需注意之處</h2><ul style="font-size:13px">'+g.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>'
   :'<h2 class="rh2">二、需注意之處</h2><div style="font-size:13px">操作正常,沒有特別需要注意的地方。</div>')+
  tbl+
  '<h2 class="rh2">四、防偽驗證</h2><div style="font-size:12.5px">驗證碼:<b>'+code+'</b>(老師可在練習檔按 Ctrl+Alt+T 驗證)</div>'+
  '<div style="font-size:12px;margin-top:4px">摘要碼:</div><div class="dig">'+digest+'</div>'+
  '<h2 class="rh2">五、操作紀錄(最後 25 項)</h2><div style="font-size:11.5px;line-height:1.5;color:#555">'+st.log.slice(-25).map(esc).join('<br>')+'</div>'+
  '<div class="signbox">老師評語:________________________________________________ &nbsp;&nbsp; 簽署:____________ &nbsp;&nbsp; 日期:____________</div>';
}

/* ============================================================
   12. 老師驗證工具 (Ctrl+Alt+T)
   ============================================================ */
function teacherTool(){
 const L=$('#layer');
 L.innerHTML='<div class="dlg" style="min-width:520px"><div class="dh">老師專用:報告驗證工具</div><div class="db">'+
  '請貼上學生報告中的「摘要碼」:<div style="margin:5px 0"><textarea id="tvd" style="width:100%;height:80px;font-family:Consolas,monospace;font-size:11px"></textarea></div>'+
  '報告上的驗證碼:<div style="margin:5px 0"><input id="tvc" type="text" placeholder="ACC2-XXXX-XXXX"></div><div id="tvr" style="font-size:13px"></div></div>'+
  '<div class="df"><button id="tvgo">驗證</button><button id="tvx">關閉</button></div></div>';
 L.style.display='flex';
 $('#tvx').onclick=()=>{L.style.display='none';};
 $('#tvgo').onclick=()=>{
  const d=$('#tvd').value.trim(),c=$('#tvc').value.trim().toUpperCase();
  try{
   const o=JSON.parse(b64d(d)),ok=(vcode(d)===c);
   $('#tvr').innerHTML='<div style="margin-top:8px;padding:8px;background:'+(ok?'#eaf7ee':'#fdecec')+';border:1px solid '+(ok?'#8c8':'#e99')+'">'+
    '<b>'+(ok?'✔ 驗證碼相符,報告內容未被修改':'✘ 驗證碼不符,報告可能被修改')+'</b><br>'+
    '姓名:'+esc(o.name)+'  班別:'+esc(o.cls)+'  班號:'+esc(o.sid||'-')+'<br>練習:'+esc(o.title)+'<br>'+
    '<b style="font-size:15px">最終得分:'+fmtM(o.final)+' / '+fmtM(o.full)+(o.pct!=null?'('+o.pct+'%)':'')+'</b><br>'+
    '(操作分 '+fmtM(o.raw)+',提示扣 '+fmtM(o.dh)+',誤操作扣 '+fmtM(o.de)+')<br>'+
    '用時:'+esc(o.dur)+'  提示 '+o.hints+' 次  誤操作 '+o.errs+' 次  提交 '+o.submits+' 次<br>'+
    '開始:'+esc(o.start)+'  完成:'+esc(o.end)+'</div>';
  }catch(e){$('#tvr').innerHTML='<div style="color:#b00;margin-top:8px">摘要碼格式錯誤,無法解讀。</div>';}
 };
}

/* ============================================================
   13. 啟動
   ============================================================ */
pad();
$('#coverFull').textContent='滿分 '+fmtM(fullMark())+' 分';
$('#coverPen').textContent='每次提示扣 '+fmtM(EX.penalty.hint)+' 分,最多扣 '+fmtM(EX.penalty.hintMax)+' 分';
$('#btnStart').onclick=()=>{
 const n=$('#s_name').value.trim(),c=$('#s_cls').value.trim();
 if(!n||!c){alert('請填寫姓名及班別。');return;}
 st.info={name:n,cls:c,sid:$('#s_id').value.trim()};
 st.start=new Date();
 $('#start').style.display='none';
 $('#topinfo').textContent='學生:'+n+'('+c+(st.info.sid?' '+st.info.sid:'')+')';
 log('開始練習(承接練習一:4 個欄位、6 筆記錄)');
 setStatus('請在導覽窗格用滑鼠右鍵按「'+EX.tableName+'」→ 設計檢視。');
 st.tab='home';render();
 setInterval(()=>{const s=Math.floor((Date.now()-st.start)/1000);
  $('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},1000);
};
render();
</script>
